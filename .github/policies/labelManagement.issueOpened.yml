id: labelManagement.issueOpened
name: GitOps.PullRequestIssueManagement
description: Handlers for when an issue is first opened
owner:
resource: repository
disabled: false
where:
configuration:
  resourceManagementConfiguration:
    eventResponderTasks:
      - description: Add CodeFlow link to new PRs
        if:
          - payloadType: Pull_Request
          - isAction:
              action: Opened
        then:
          - addCodeFlowLink
      - description: Add Copilot-Instructions label to PRs modifying Copilot instruction files
        if:
          - payloadType: Pull_Request
          - or:
              - isAction:
                  action: Opened
              - isAction:
                  action: Synchronize
          - filesMatchPattern:
              pattern: ^\.github/(copilot-instructions\.md|instructions/.+\.instructions\.md)$
              matchAny: true
          - not:
              hasLabel:
                label: Copilot-Instructions
        then:
          - addLabel:
              label: Copilot-Instructions
      - description: Add Needs-Triage to new issues
        if:
          - payloadType: Issues
          - isAction:
              action: Opened
        then:
          - addLabel:
              label: Needs-Triage
onFailure:
onSuccess:
